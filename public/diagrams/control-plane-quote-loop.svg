<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">From Binance depth to a committed Light DEX book</title>
  <desc id="desc">Binance Spot depth feeds the Rust participant. It chooses whole-dollar bid and ask prices, generates one-BTC limit-order or cancel transactions with consecutive account nonces, sends them through the node cluster, and reads back the committed book.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#60e1c2" stroke-width="1.5"/></marker>
    <style>
      .bg{fill:#0b151b}.panel{fill:#12252c;stroke:#426066;stroke-width:1.5}.title{fill:#e7f0ef;font-family:Arial,sans-serif;font-size:20px;font-weight:600}.body{fill:#b8cfd0;font-family:Arial,sans-serif;font-size:14px}.small{fill:#91aab0;font-family:monospace;font-size:12px}.accent{fill:#60e1c2;font-family:monospace;font-size:12px;font-weight:600;letter-spacing:.05em}.line{fill:none;stroke:#60e1c2;stroke-width:2;marker-end:url(#arrow)}.bid{fill:#60e1c2}.ask{fill:#ef9d9d}
    </style>
  </defs>
  <rect class="bg" width="960" height="410" rx="8"/>
  <text class="accent" x="40" y="42">A PARTICIPANT, NOT A CONSENSUS REPLICA</text>
  <rect class="panel" x="40" y="76" width="196" height="176" rx="8"/>
  <text class="title" x="58" y="111">Binance depth</text>
  <text class="body" x="58" y="146">Spot BTCUSDT</text>
  <text class="body" x="58" y="172">Top five levels</text>
  <text class="small" x="58" y="222">External input</text>
  <rect class="panel" x="274" y="76" width="196" height="176" rx="8"/>
  <text class="title" x="292" y="111">Quote planner</text>
  <text class="body" x="292" y="146">Whole-dollar prices</text>
  <text class="body" x="292" y="172">1 BTC per level</text>
  <text class="small" x="292" y="222">Rust participant</text>
  <rect class="panel" x="508" y="76" width="196" height="176" rx="8"/>
  <text class="title" x="526" y="111">Transactions</text>
  <text class="body" x="526" y="146">Place · cancel</text>
  <text class="body" x="526" y="172">Nonces 12, 13, 14…</text>
  <text class="small" x="526" y="222">Ordinary node input</text>
  <rect class="panel" x="742" y="76" width="178" height="176" rx="8"/>
  <text class="title" x="760" y="111">Node cluster</text>
  <text class="body" x="760" y="146">Propose and vote</text>
  <text class="body" x="760" y="172">Commit block</text>
  <text class="small" x="760" y="222">Replicated state</text>
  <path class="line" d="M237 164 H262"/><path class="line" d="M471 164 H496"/><path class="line" d="M705 164 H730"/>
  <rect class="panel" x="274" y="297" width="430" height="70" rx="8"/>
  <rect class="bid" x="295" y="316" width="7" height="32" rx="2"/><rect class="ask" x="312" y="316" width="7" height="32" rx="2"/>
  <text class="title" x="337" y="328">Committed BTC-USD order book</text>
  <text class="small" x="337" y="350">Shown with source node and chain height</text>
  <path class="line" d="M830 253 V331 H717"/>
</svg>
