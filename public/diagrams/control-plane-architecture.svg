<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Light DEX control-plane architecture</title>
  <desc id="desc">React calls a Tauri Rust controller, which launches and polls separate Rust nodes. The nodes communicate with each other for consensus. Rust protocol types generate TypeScript bindings for React.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#60e1c2" stroke-width="1.5"/></marker>
    <style>
      .bg{fill:#0b151b}.panel{fill:#12252c;stroke:#426066;stroke-width:1.5}.node{fill:#193139;stroke:#60e1c2;stroke-width:1.5}.title{fill:#e7f0ef;font-family:Arial,sans-serif;font-size:22px;font-weight:600}.body{fill:#b8cfd0;font-family:Arial,sans-serif;font-size:15px}.small{fill:#91aab0;font-family:monospace;font-size:12px;letter-spacing:.04em}.accent{fill:#60e1c2;font-family:monospace;font-size:13px;font-weight:600;letter-spacing:.06em}.line{fill:none;stroke:#60e1c2;stroke-width:2;marker-end:url(#arrow)}.muted{fill:none;stroke:#52737a;stroke-width:1.5;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect class="bg" width="960" height="480" rx="8"/>
  <text class="accent" x="40" y="43">LIGHT DEX / LOCAL DESKTOP SETUP</text>
  <rect class="panel" x="40" y="80" width="240" height="160" rx="8"/>
  <text class="title" x="62" y="118">React UI</text>
  <text class="body" x="62" y="154">Launch · submit · inject faults</text>
  <text class="body" x="62" y="181">Read metrics and order book</text>
  <text class="small" x="62" y="218">TAURI WEBVIEW</text>
  <rect class="panel" x="360" y="80" width="240" height="160" rx="8"/>
  <text class="title" x="382" y="118">Rust controller</text>
  <text class="body" x="382" y="154">Starts node processes</text>
  <text class="body" x="382" y="181">Sends commands · polls status</text>
  <text class="small" x="382" y="218">TAURI BACKEND</text>
  <rect class="panel" x="680" y="80" width="240" height="160" rx="8"/>
  <text class="title" x="702" y="118">Rust nodes</text>
  <circle class="node" cx="725" cy="175" r="19"/><circle class="node" cx="800" cy="175" r="19"/><circle class="node" cx="875" cy="175" r="19"/>
  <text class="small" x="719" y="180">0</text><text class="small" x="794" y="180">1</text><text class="small" x="869" y="180">2</text>
  <path class="muted" d="M744 175 H781 M819 175 H856"/>
  <text class="small" x="702" y="218">PEER-TO-PEER CONSENSUS</text>
  <path class="line" d="M281 160 H347"/><text class="small" x="293" y="146">invoke</text>
  <path class="line" d="M601 160 H667"/><text class="small" x="609" y="146">TCP</text>
  <rect class="panel" x="40" y="292" width="880" height="135" rx="8"/>
  <text class="accent" x="62" y="327">ONE PROTOCOL DEFINITION</text>
  <text class="body" x="62" y="365">Rust Transaction · NodeStatus · control types</text>
  <path class="line" d="M465 360 H543"/>
  <text class="small" x="472" y="347">ts-rs</text>
  <text class="body" x="560" y="365">Generated TypeScript bindings</text>
  <text class="small" x="62" y="402">The frontend does not hand-maintain a second transaction schema.</text>
</svg>
